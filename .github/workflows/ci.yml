name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends jq qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qttest qt6-declarative-dev-tools qt6-qpa-plugins

      - name: Validate manifest
        run: jq empty manifest.json

      - name: Run helper tests
        run: tests/helper-test.sh

      - name: Run panel source tests
        run: tests/panel-source-test.sh

      - name: Run service source tests
        run: tests/service-source-test.sh

      - name: Run QML behavior tests
        run: tests/qml-test.sh
